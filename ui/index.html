<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League record book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18202B; --muted:#5B6776; --line:#D5DBE2;
  --win:#2F6B4F; --loss:#A8261D; --gold:#9A6E0F; --pennant:#1F3A5F; --pennant-ink:#F3F5F8; --pennant-gold:#E5B94E;
  --c1:#1F5FA8; --c2:#B04A1E; --c3:#2F7D55; --c4:#7A3E9D; --c5:#A07B12; --c6:#0E7C86; --faint:#C4CCD6;
  --display:"Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#171E27; --ink:#E4E9EF; --muted:#94A0AE; --line:#2A3441;
    --win:#5DBB8E; --loss:#E0645A; --gold:#E5B94E; --pennant:#24456F;
    --c1:#6FA8EA; --c2:#EE8A5E; --c3:#6CC89A; --c4:#B98BE0; --c5:#E0C060; --c6:#58C4CE; --faint:#35404E;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --ink:#E4E9EF; --muted:#94A0AE; --line:#2A3441;
  --win:#5DBB8E; --loss:#E0645A; --gold:#E5B94E; --pennant:#24456F;
  --c1:#6FA8EA; --c2:#EE8A5E; --c3:#6CC89A; --c4:#B98BE0; --c5:#E0C060; --c6:#58C4CE; --faint:#35404E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.in-app,html.in-app body{height:100%;overflow:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
#root{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0}
h1{font-size:clamp(40px,7vw,72px)}
h2{font-size:30px;margin:0 0 12px}
h3{font-size:21px;font-weight:600;margin:0 0 8px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.muted{color:var(--muted)}
.title-row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.summary{color:var(--muted);margin-top:6px;font-size:16px}
.note{margin-top:14px;padding:10px 14px;border-left:3px solid var(--gold);background:var(--surface);max-width:70ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pennant);color:var(--pennant-ink);border-color:var(--pennant)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Champion banners: the one loud element */
.rafters{margin:28px -20px 8px;padding:0 20px;border-top:6px solid var(--pennant);overflow-x:auto}
.banners{display:flex;gap:14px;padding-bottom:6px;min-height:170px}
.banner{flex:0 0 108px;min-height:162px;padding-bottom:34px!important;background:var(--pennant);color:var(--pennant-ink);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);padding:14px 10px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.banner .yr{font-family:var(--display);font-weight:800;font-size:34px;color:var(--pennant-gold);line-height:1}
.banner .rule{width:36px;height:2px;background:var(--pennant-gold);margin:8px 0}
.banner .who{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.05;overflow-wrap:anywhere}
.banner .who.long{font-size:16px}
.banner .ru{font-size:11px;line-height:1.2;opacity:.75;margin-top:6px;overflow-wrap:anywhere}
.banner.open{background:transparent;border:2px dashed var(--line);clip-path:none;color:var(--muted);height:140px}
.banner.open .yr{color:var(--muted)}

.controls{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs{display:flex;flex-wrap:wrap;gap:2px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -3px 0 var(--pennant)}
.scope{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.scope button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;color:var(--muted)}
.scope button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.stack{display:grid;gap:22px}
.stack>*,.grid2>*{min-width:0}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.lede{max-width:72ch;color:var(--muted);margin:-4px 0 14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td.name{font-weight:700}
td.name,th.l,td.l{text-align:left}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,560px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--loss);color:#fff} .toast.ok{background:var(--win);color:#fff}
.picks-head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.pk-list{display:grid;gap:8px}
.pk-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px}
.pk{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0}
.pk:nth-child(3){align-items:flex-end;text-align:right}
.pk .pk-n{font-weight:700;overflow-wrap:anywhere}
.pk .pk-s{font-size:12px;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--pennant);background:var(--pennant);color:var(--pennant-ink)}
.pk[aria-pressed="true"] .pk-s{color:var(--pennant-gold)}
.pk[disabled]{cursor:default}
.pk-vs{align-self:center;color:var(--muted);font-size:13px}
.codebox{margin-top:12px;display:grid;gap:8px;max-width:560px}
textarea.code{width:100%;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);word-break:break-all}
.codebox .btn{justify-self:start}
details.more{margin-top:12px}
.explain{max-width:75ch;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.explain b{color:var(--ink)}
details.more summary{cursor:pointer;font-weight:600;margin-bottom:6px}
.btn.sm{padding:4px 10px;font-size:13px}
.ln{display:inline-flex;flex-direction:column;align-items:center;min-width:76px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;cursor:pointer;line-height:1.25}
.ln .ln-l{font-size:13px;font-weight:600}
.ln .ln-p{font-size:13px;color:var(--c1);font-weight:700}
.ln[aria-pressed="true"]{background:var(--pennant);border-color:var(--pennant);color:var(--pennant-ink)}
.ln[aria-pressed="true"] .ln-p{color:var(--pennant-gold)}
.ln[disabled]{opacity:.55;cursor:not-allowed}
table.bboard{width:auto}
table.bboard td,table.bboard th{padding:5px 8px;text-align:center}
table.bboard td.name,table.bboard th.l{text-align:left;padding-right:24px}
table.bboard tbody+tbody{border-top:2px solid var(--line)}
.slip{border:2px solid var(--pennant)}
.slip-sel .ln-p{color:var(--c1);font-weight:700;margin-left:4px}
.slip-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;margin:10px 0}
.slip-row label{display:grid;gap:4px;font-weight:600;font-size:14px}
.slip-row input{width:140px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.manager{border-style:dashed}
.manager h2{margin-bottom:4px}
.draftbar{position:sticky;top:64px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;margin-bottom:14px}
.mgr-block{padding:14px 0;border-top:1px solid var(--line)}
.mgr-block .actions{margin-top:8px}
.editor input{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);text-align:right}
.settings{display:flex;flex-wrap:wrap;gap:12px 20px}
.settings label{display:grid;gap:4px;font-size:14px;font-weight:600}
.settings input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.me.signin{flex-wrap:wrap;gap:6px}
.me.signin select,.me.signin input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:400}
.me.signin input{width:150px}
.pw-custom{width:130px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.linkish{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.check{display:flex;align-items:center;gap:6px;font-size:14px;margin:8px 0}
tbody tr:last-child td{border-bottom:0}
th button{border:0;background:none;padding:0;cursor:pointer;color:inherit;font-weight:600}
th button[data-active="true"]{color:var(--ink)}
.pos{color:var(--win)} .neg{color:var(--loss)}
.trophy{color:var(--gold);font-weight:700}

.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:4px 0 18px}
.fact .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.fact .k{color:var(--muted);font-size:13px}

ol.rec{margin:0;padding:0 0 0 22px}
ol.rec li{padding:5px 0;border-bottom:1px solid var(--line)}
ol.rec li:last-child{border-bottom:0}
ol.rec b{font-weight:700}
ol.rec .n{font-family:var(--display);font-weight:800;font-size:19px;margin-left:4px}
ol.rec .d{display:block;color:var(--muted);font-size:13px}

.matrix td,.matrix th{text-align:center;padding:0;border:1px solid var(--line)}
.matrix th{padding:6px 8px;font-size:13px}
.matrix th.rowh{text-align:left}
.matrix td button{width:100%;min-width:54px;border:0;padding:8px 4px;cursor:pointer;background:transparent;font-weight:600}
.matrix td.self{background:var(--bg)}
.matrix td button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}

.heat td{text-align:center;font-weight:600;border:1px solid var(--line)}
.heat td.name{text-align:left}
.heat td.champ{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:12px}
@media (max-width:640px){.chart text{font-size:13px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}

.awards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.award{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--pennant);border-radius:6px;padding:10px 12px}
.award .k{color:var(--muted);font-size:13px}
.award .v{font-weight:700;font-size:16px;margin-top:2px}
.award .n{font-family:var(--display);font-weight:800;font-size:22px;margin-left:4px}
.award .d{color:var(--muted);font-size:13px}
table.board td.notes{text-align:left;white-space:normal;min-width:240px;color:var(--muted);font-size:13px}
.match h3{margin-bottom:10px}
.gotw{display:inline-block;background:var(--pennant);color:var(--pennant-gold);font-family:var(--display);font-weight:800;font-size:15px;padding:2px 10px;border-radius:4px;margin-bottom:8px}
.odds{height:10px;border-radius:5px;background:var(--c2);overflow:hidden}
.odds span{display:block;height:100%;background:var(--c1)}
.oddsl{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin:4px 0 10px}
.oddsl span:first-child{color:var(--c1)} .oddsl span:last-child{color:var(--c2)}
table.mini{font-size:13px}
table.mini th,table.mini td{padding:5px 5px}
table.mini td.name{white-space:normal;min-width:80px}
.matches{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.matches>*{min-width:0}
ul.story{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
ul.story li{margin:3px 0}
.column{margin-top:14px;padding:14px 16px;background:var(--bg);border-radius:6px;white-space:pre-wrap;max-width:75ch;line-height:1.6}
.pick{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(10,14,20,.55)}
.import{display:grid;gap:12px}
.import label{display:grid;gap:4px;font-weight:600;font-size:14px}
.import input[type=text],.import textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:400}
.import textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
pre.tpl{margin:0;padding:10px 12px;background:var(--bg);border-radius:6px;overflow-x:auto;font-size:12.5px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#import-status{min-height:1.5em;font-size:14px}
#import-status.err{color:var(--loss)} #import-status.ok{color:var(--win)}
@media (max-width:600px){ table.bboard td.name{padding-right:6px} table.bboard td,table.bboard th{padding:4px 3px} .ln{min-width:62px;padding:4px 5px} .controls{position:static} .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%} .tabs button{white-space:nowrap} #root{padding:18px 14px 48px} .rafters{margin:20px -14px 8px;padding:0 14px} .banner{flex-basis:92px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>
</head>
<body>
<template id="shell">
<header>
  <div class="title-row">
    <div>
      <h1 id="league-name">League</h1>
      <p id="league-summary" class="summary"></p>
    </div>
    <button id="open-import" class="btn" type="button">Import league data</button>
  </div>
  <p id="sample-note" class="note" hidden>This is a made-up sample league so you can see how everything works. Import your league's games to replace it.</p>
</header>
<section class="rafters" aria-label="Champions by season"><div id="banners" class="banners"></div></section>
<nav class="controls" aria-label="Views">
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="week" type="button">This week</button>
    <button role="tab" data-tab="book" type="button">Sportsbook</button>
    <button role="tab" data-tab="standings" type="button">All-time standings</button>
    <button role="tab" data-tab="h2h" type="button">Head to head</button>
    <button role="tab" data-tab="managers" type="button">Managers</button>
    <button role="tab" data-tab="records" type="button">Record book</button>
    <button role="tab" data-tab="trends" type="button">Trends</button>
    <button role="tab" data-tab="seasons" type="button">Seasons</button>
  </div>
  <div class="scope" role="group" aria-label="Games counted">
    <button data-scope="regular" type="button">Regular season</button>
    <button data-scope="all" type="button">Include playoffs</button>
  </div>
</nav>
<main id="view"></main>
<dialog id="import" aria-labelledby="import-title">
  <div class="import">
    <h2 id="import-title">Import league data</h2>
    <p class="muted">One row per game. Use manager names, not team names, so records follow people across seasons. <code>type</code> is <code>regular</code>, <code>playoff</code>, <code>final</code> (the title game) or <code>consolation</code>. Consolation games are left out of all stats. Rows typed <code>scheduled</code> with blank scores are upcoming matchups; optional <code>proj_a</code>/<code>proj_b</code> columns carry ESPN projections, and <code>strength</code> rows carry season roster projections.</p>
    <pre class="tpl">season,week,manager_a,score_a,manager_b,score_b,type
2024,1,Marcus,121.4,Jordan,98.2,regular
2024,15,Marcus,131.0,Kyle,118.6,playoff
2024,16,Marcus,140.1,Nate,133.9,final</pre>
    <label>League name <input type="text" id="in-name" maxlength="60"></label>
    <label>CSV file <input type="file" id="in-file" accept=".csv,text/csv,text/plain"></label>
    <label>Or paste CSV <textarea id="in-text" rows="6" spellcheck="false"></textarea></label>
    <label>Name changes <span class="muted" style="font-weight:400">One per line, applied to every import. Leave the file empty to just update names.</span><textarea id="in-renames" rows="3" spellcheck="false" placeholder="Alex Atlas = Alex Atlas &amp; Leo"></textarea></label>
    <p id="import-status" role="status"></p>
    <div class="actions">
      <button id="btn-close" class="btn" type="button">Close</button>
      <button id="btn-preview" class="btn" type="button">Preview</button>
      <button id="btn-save" class="btn primary" type="button" hidden>Save for the league</button>
    </div>
  </div>
</dialog>
</template>
<div id="root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script id="league-data" type="application/json">{"name":"","games":[]}</script>
<script id="app-src">
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function f1(n){ return (Math.round(n * 10) / 10).toFixed(1); }
function f2(n){ return (Math.round(n * 100) / 100).toFixed(2); }
function pct(x){ return isFinite(x) ? x.toFixed(3).replace(/^0/, '') : '—'; }
function sgn(n, d){ var s = d === 2 ? f2(n) : f1(n); return n > 0 ? '+' + s : s; }
function cls(n){ return n > 0.05 ? 'pos' : n < -0.05 ? 'neg' : ''; }
function rec(w, l, t){ return w + '–' + l + (t ? '–' + t : ''); }

/* ---------------- Streamlit bridge (server mode) ---------------- */
var IN_STREAMLIT = /[?&]streamlitUrl=/.test(location.search);
var SERVER = null, lastNotice = null, pwOpen = false, adminOpen = false;
function stPost(type, extra){ try { window.parent.postMessage(Object.assign({ isStreamlitMessage:true, type:type }, extra || {}), '*'); } catch (e) {} }
function sendAction(a){
  a.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  stPost('streamlit:setComponentValue', { value:a, dataType:'json' });
  toast('Working…');
}
function canSubmit(){ return SERVER ? !!getMe() : canWrite(); }

var HEAD = function(title){
  return '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + esc(title) + '</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">';
};

/* ---------------- data ---------------- */
var TYPES = { regular:1, playoff:1, final:1, consolation:1, scheduled:1, strength:1 };
function rowsToGames(rows, ren){
  ren = ren || {};
  var nm = function(x){ return Object.prototype.hasOwnProperty.call(ren, x) ? ren[x] : x; };
  return rows.map(function(r){ var t = r[6] || 'regular', pr = r[7] || []; return { season:+r[0], week:+r[1], a:nm(r[2]), sa: t === 'scheduled' ? null : +r[3], b:nm(r[4]), sb: t === 'scheduled' ? null : +r[5], type:t, pa: pr[0] || null, pb: pr[1] || null }; });
}
function readEmbedded(){

function sampleLeague(){
  var seed = 20180901;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function gauss(){ var u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }
  function shuffle(a){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var base = ['Marcus','Jordan','Tyler','Sam','Chris','Nate','Ben','Andre','Kyle','Dev'];
  var skill = { Marcus:7, Jordan:3, Tyler:-2, Sam:1, Chris:-5, Nate:4, Ben:0, Andre:-1, Kyle:2, Dev:-3, Priya:6 };
  var rows = [];
  for (var season = 2018; season <= 2025; season++) {
    var mgrs = base.map(function(m){ return (m === 'Dev' && season >= 2021) ? 'Priya' : m; });
    var lvl = 106 + (season - 2018) * 1.8;
    var score = function(m){ return Math.max(38, Math.round((lvl + skill[m] + gauss() * 20) * 100) / 100 + Math.round(rnd() * 100) / 100); };
    var tab = {}; mgrs.forEach(function(m){ tab[m] = { m:m, w:0, pf:0 }; });
    for (var week = 1; week <= 14; week++) {
      var order = shuffle(mgrs.slice());
      for (var k = 0; k < order.length; k += 2) {
        var a = order[k], b = order[k + 1], sa = score(a), sb = score(b);
        if (sa === sb) sb -= 0.1;
        tab[a].pf += sa; tab[b].pf += sb; tab[sa > sb ? a : b].w++;
        rows.push([season, week, a, sa, b, sb, 'regular']);
      }
    }
    var seeds = Object.keys(tab).map(function(m){ return tab[m]; }).sort(function(x, y){ return y.w - x.w || y.pf - x.pf; }).map(function(r){ return r.m; });
    var win = [], lose = [];
    [[seeds[0], seeds[3]], [seeds[1], seeds[2]]].forEach(function(p){
      var sa = score(p[0]) + 3, sb = score(p[1]); if (sa === sb) sb -= 0.1;
      rows.push([season, 15, p[0], sa, p[1], sb, 'playoff']);
      win.push(sa > sb ? p[0] : p[1]); lose.push(sa > sb ? p[1] : p[0]);
    });
    var fa = score(win[0]), fb = score(win[1]); if (fa === fb) fb -= 0.1;
    rows.push([season, 16, win[0], fa, win[1], fb, 'final']);
    rows.push([season, 16, lose[0], score(lose[0]), lose[1], score(lose[1]), 'consolation']);
  }
  return { name:'Sample League', games:rows };
}

function parseCSV(text){
  var out = [], row = [], cell = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); out.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); out.push(row); }
  return out.filter(function(r){ return r.some(function(x){ return x.trim() !== ''; }); });
}

var ALIASES = {
  season:['season','year'], week:['week','matchup_period','period'],
  manager_a:['manager_a','owner_a','team_a','home'], score_a:['score_a','points_a','home_score'],
  manager_b:['manager_b','owner_b','team_b','away'], score_b:['score_b','points_b','away_score'],
  type:['type','game_type'],
  proj_a:['proj_a','projected_a'], proj_b:['proj_b','projected_b']

var OPTIONAL = { type:1, proj_a:1, proj_b:1 };
function csvToRows(text){
  var grid = parseCSV(text);
  if (grid.length < 2) return { error:'No games found. The first row should be the header, then one row per game.' };
  var head = grid[0].map(function(h){ return h.trim().toLowerCase(); });
  var idx = {};
  for (var key in ALIASES) {
    idx[key] = -1;
    for (var j = 0; j < ALIASES[key].length; j++) { var p = head.indexOf(ALIASES[key][j]); if (p >= 0) { idx[key] = p; break; } }
    if (idx[key] < 0 && !OPTIONAL[key]) return { error:'Missing column "' + key + '". Expected: season, week, manager_a, score_a, manager_b, score_b, type.' };
  }
  var rows = [], errs = [];
  for (var r = 1; r < grid.length; r++) {
    var g = grid[r];
    var get = function(k){ return idx[k] < 0 ? '' : String(g[idx[k]] == null ? '' : g[idx[k]]).trim(); };
    var season = parseInt(get('season'), 10), week = parseInt(get('week'), 10);
    var a = get('manager_a'), b = get('manager_b');
    var sa = parseFloat(get('score_a')), sb = parseFloat(get('score_b'));
    var type = (get('type') || 'regular').toLowerCase();
    if (type === 'championship') type = 'final';
    var bad = [];
    if (!(season > 1900)) bad.push('season');
    if (type === 'strength') {
      if (!(season > 1900) || !a || !(sa > 0)) { errs.push('Row ' + (r + 1) + ': check season, manager_a, score_a'); continue; }
      rows.push([season, 0, a, Math.round(sa * 100) / 100, '', null, 'strength']);
      continue;
    }
    if (!(week >= 0)) bad.push('week');
    if (!a) bad.push('manager_a');
    if (!b) bad.push('manager_b');
    if (!TYPES[type]) bad.push('type "' + type + '"');
    if (type === 'scheduled') { sa = null; sb = null; }
    else {
      if (!isFinite(sa)) bad.push('score_a');
      if (!isFinite(sb)) bad.push('score_b');
    }
    if (a && a === b) bad.push('same manager on both sides');
    if (bad.length) { errs.push('Row ' + (r + 1) + ': check ' + bad.join(', ')); continue; }
    var row = [season, week, a, sa == null ? null : Math.round(sa * 100) / 100, b, sb == null ? null : Math.round(sb * 100) / 100, type];
    var pa = parseFloat(get('proj_a')), pb = parseFloat(get('proj_b'));
    if (type === 'scheduled' && (pa > 0 || pb > 0)) row.push([pa > 0 ? Math.round(pa * 100) / 100 : null, pb > 0 ? Math.round(pb * 100) / 100 : null]);
    rows.push(row);
  }
  if (errs.length) return { error: errs.length + ' row' + (errs.length > 1 ? 's' : '') + ' need fixing. ' + errs.slice(0, 4).join('. ') + (errs.length > 4 ? '. …' : '.') };
  var seen = {}, dupes = 0;
  rows.forEach(function(x){ [x[2], x[4]].forEach(function(m){ if (!m) return; var k = x[0] + '|' + x[1] + '|' + x[6] + '|' + m; if (seen[k]) dupes++; seen[k] = 1; }); });
  return { rows:rows, warning: dupes ? dupes + ' manager-weeks appear more than once. Check for duplicate rows.' : '' };
}

/* ---------------- stats ---------------- */
function isReg(g){ return g.type === 'regular'; }
function isPost(g){ return g.type === 'playoff' || g.type === 'final'; }
function winnerOf(g){ return g.sa > g.sb ? g.a : g.sb > g.sa ? g.b : null; }
function sides(g){ return [ { m:g.a, o:g.b, pf:g.sa, pa:g.sb, g:g }, { m:g.b, o:g.a, pf:g.sb, pa:g.sa, g:g } ]; }
function when(g){ return g.season + ', week ' + g.week + (g.type === 'final' ? ' (title game)' : g.type === 'playoff' ? ' (playoffs)' : ''); }
function byName(a, b){ return a.localeCompare(b); }

function compute(all){
  all = all.slice().sort(function(x, y){ return x.season - y.season || x.week - y.week; });
  var strength = {};
  all.forEach(function(g){ if (g.type === 'strength') (strength[g.season] = strength[g.season] || {})[g.a] = g.sa; });
  all = all.filter(function(g){ return g.type !== 'strength'; });
  var games = all.filter(function(g){ return g.type !== 'scheduled'; });
  var lastG = games[games.length - 1];
  var upcoming = all.filter(function(g){ return g.type === 'scheduled' && (!lastG || g.season > lastG.season || (g.season === lastG.season && g.week > lastG.week)); });
  var seasons = [], mset = {};
  games.forEach(function(g){ if (seasons.indexOf(g.season) < 0) seasons.push(g.season); mset[g.a] = 1; mset[g.b] = 1; });
  seasons.sort(function(a, b){ return a - b; });
  var managers = Object.keys(mset).sort(byName);
  var champs = {}, runners = {};
  games.forEach(function(g){ if (g.type === 'final') { var w = winnerOf(g); if (w) { champs[g.season] = w; runners[g.season] = w === g.a ? g.b : g.a; } } });

  var byWeek = {};
  games.forEach(function(g){ if (isReg(g)) { var k = g.season + '|' + g.week; (byWeek[k] = byWeek[k] || []).push([g.a, g.sa], [g.b, g.sb]); } });
  var allPlay = {}, allPlayS = {};
  function bump(o, m){ return o[m] = o[m] || { w:0, l:0, t:0, xw:0 }; }
  Object.keys(byWeek).forEach(function(k){
    var list = byWeek[k], s = +k.split('|')[0], n = list.length - 1;
    allPlayS[s] = allPlayS[s] || {};
    list.forEach(function(p){
      var beat = 0, lost = 0, tied = 0;
      list.forEach(function(q){ if (q === p) return; if (p[1] > q[1]) beat++; else if (p[1] < q[1]) lost++; else tied++; });
      [bump(allPlay, p[0]), bump(allPlayS[s], p[0])].forEach(function(r){ r.w += beat; r.l += lost; r.t += tied; r.xw += n ? (beat + tied / 2) / n : 0; });

  seasons.forEach(function(s){

        var r = t[x.m] = t[x.m] || { m:x.m, w:0, l:0, t:0, pf:0, pa:0, gp:0 };
        r.gp++; r.pf += x.pf; r.pa += x.pa;
        if (x.pf > x.pa) r.w++; else if (x.pf < x.pa) r.l++; else r.t++;
      });
    });
    var rows = Object.keys(t).map(function(m){ return t[m]; });
    rows.forEach(function(r){

      var ap = allPlayS[s] && allPlayS[s][r.m];
      r.ap = ap ? (ap.w + ap.t / 2) / Math.max(1, ap.w + ap.l + ap.t) : 0;
      r.xw = ap ? ap.xw : 0; r.luck = (r.w + r.t / 2) - r.xw;

  });

  return { games:games, upcoming:upcoming, strength:strength, seasons:seasons, managers:managers, champs:champs, runners:runners, allPlay:allPlay, seasonTables:seasonTables, postSeasons:postSeasons };
}

function managerStats(L, filter){
  var R = {};
  L.managers.forEach(function(m){ R[m] = { m:m, w:0, l:0, t:0, pf:0, pa:0, gp:0, hi:null, lo:null, seas:{}, pw:0, pl:0, titles:0, finals:0 }; });
  L.games.forEach(function(g){

      if (isPost(g)) { if (x.pf > x.pa) r.pw++; else if (x.pf < x.pa) r.pl++; }
      if (!filter(g)) return;
      r.gp++; r.pf += x.pf; r.pa += x.pa;
      if (x.pf > x.pa) r.w++; else if (x.pf < x.pa) r.l++; else r.t++;

  Object.keys(L.champs).forEach(function(s){ R[L.champs[s]].titles++; R[L.champs[s]].finals++; R[L.runners[s]].finals++; });

    r.npo = L.seasons.filter(function(s){ return L.postSeasons[m + '|' + s]; }).length;
    r.winpct = r.gp ? (r.w + r.t / 2) / r.gp : 0;
    r.ppg = r.gp ? r.pf / r.gp : 0; r.papg = r.gp ? r.pa / r.gp : 0; r.diff = r.ppg - r.papg;

    L.seasons.forEach(function(s){ (L.seasonTables[s] || []).forEach(function(x){ if (x.m === m) regW += x.w + x.t / 2; }); });

function streaks(L, filter){

  L.games.forEach(function(g){ if (filter(g)) sides(g).forEach(function(x){ (per[x.m] = per[x.m] || []).push(x); }); });
  return Object.keys(per).map(function(m){
    var bw = { n:0 }, bl = { n:0 }, cur = { k:null, n:0 };
    per[m].forEach(function(x){
      var k = x.pf > x.pa ? 'W' : x.pf < x.pa ? 'L' : 'T';
      if (k === cur.k) cur = { k:k, n:cur.n + 1, start:cur.start }; else cur = { k:k, n:1, start:x.g };
      if (k === 'W' && cur.n > bw.n) bw = { n:cur.n, start:cur.start, end:x.g };
      if (k === 'L' && cur.n > bl.n) bl = { n:cur.n, start:cur.start, end:x.g };

function h2h(L, filter){
  var M = {};
  L.games.forEach(function(g){
    if (!filter(g)) return;
    sides(g).forEach(function(x){
      M[x.m] = M[x.m] || {};
      var r = M[x.m][x.o] = M[x.m][x.o] || { w:0, l:0, t:0, pf:0, pa:0, games:[] };
      if (x.pf > x.pa) r.w++; else if (x.pf < x.pa) r.l++; else r.t++;
      r.pf += x.pf; r.pa += x.pa; r.games.push(x);

function tint(v){

var PALETTE = ['--c1','--c2','--c3','--c4','--c5','--c6'];

function lineChart(opts){
  var narrow = window.innerWidth < 640; var W = narrow ? 400 : 720, H = Math.round((opts.height || 280) * (narrow ? 0.85 : 1)), pl = 46, pr = 18, pt = 14, pb = 30;
  var xs = opts.xs, all = [];
  opts.series.forEach(function(s){ s.values.forEach(function(v){ if (v != null) all.push(v); }); });
  if (!all.length) return '<p class="muted">Not enough games yet.</p>';
  var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  var span = hi - lo || 10, step = Math.pow(10, Math.floor(Math.log10(span / 4)));
  [1, 2, 5, 10].some(function(k){ if (span / (step * k) <= 5) { step *= k; return true; } return false; });
  if (opts.step) step = opts.step;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  if (opts.min != null) lo = opts.min;

  function X(i){ return pl + (xs.length < 2 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (xs.length - 1)); }
  function Y(v){ return pt + (hi - v) * (H - pt - pb) / ((hi - lo) || 1); }

  var a = Math.min(lo, hi), b = Math.max(lo, hi);

    out += '<text x="' + (pl - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + (step < 1 ? v.toFixed(2).replace(/^0/, '') : Math.round(v)) + '</text>';
  }
  var every = Math.ceil(xs.length / (narrow ? 5 : 10));
  xs.forEach(function(x, i){ if (i % every === 0 || i === xs.length - 1) out += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(x) + '</text>'; });
  var ordered = opts.series.filter(function(s){ return s.faint; }).concat(opts.series.filter(function(s){ return !s.faint; }));
  ordered.forEach(function(s){
    var d = '', pen = false;
    s.values.forEach(function(v, i){ if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });

    if (!s.faint) s.values.forEach(function(v, i){

    });
  });
  out += '</svg>';
  var leg = opts.series.filter(function(s){ return !s.faint; }).map(function(s){ return '<span><i style="background:var(' + s.color + ')"></i>' + esc(s.name) + '</span>'; }).join('');

}

  }).join('');
  var body = rows.map(function(r){
    return '<tr><td class="name">' + esc(r.m) + '</td><td>' + r.nseas + '</td><td>' + rec(r.w, r.l, r.t) + '</td><td>' + pct(r.winpct) + '</td>' +
      '<td>' + f1(r.ppg) + '</td><td>' + f1(r.papg) + '</td><td class="' + cls(r.diff) + '">' + sgn(r.diff) + '</td>' +
      '<td>' + f1(r.hi) + '</td><td>' + f1(r.lo) + '</td><td>' + r.npo + '</td><td>' + rec(r.pw, r.pl) + '</td>' +
      '<td class="' + (r.titles ? 'trophy' : '') + '">' + (r.titles || '') + '</td><td>' + pct(r.ap) + '</td><td class="' + cls(r.luck) + '">' + sgn(r.luck) + '</td></tr>';
  }).join('');
  return '<div class="stack"><section><h2>All-time standings</h2>' +
    '<p class="lede">Counting ' + scopeWord() + '. All-play asks how you\'d do if you played every team every week. Luck is your actual regular-season wins minus the wins that all-play record predicts: positive means the schedule helped you. Click a column to sort.</p>' +
    '<div class="panel scroll"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div></section></div>';
}

function viewH2H(){
  var M = h2h(L, filter());
  var ms = L.managers.filter(function(m){ return M[m]; });
  var head = '<tr><th></th>' + ms.map(function(m){ return '<th scope="col">' + esc(m) + '</th>'; }).join('') + '</tr>';
  var body = ms.map(function(a){
    return '<tr><th scope="row" class="rowh">' + esc(a) + '</th>' + ms.map(function(b){
      if (a === b) return '<td class="self"></td>';
      var r = M[a][b];
      if (!r) return '<td class="muted">–</td>';
      var n = r.w + r.l + r.t, p = n ? (r.w + r.t / 2) / n : null;
      var on = state.pair && state.pair[0] === a && state.pair[1] === b;
      return '<td style="' + tint(p) + '"><button type="button" data-a="' + esc(a) + '" data-b="' + esc(b) + '" aria-pressed="' + on + '" aria-label="' + esc(a + ' against ' + b + ': ' + rec(r.w, r.l, r.t)) + '">' + rec(r.w, r.l, r.t) + '</button></td>';
    }).join('') + '</tr>';
  }).join('');
  var detail = '';
  if (state.pair && M[state.pair[0]] && M[state.pair[0]][state.pair[1]]) {
    var a = state.pair[0], b = state.pair[1], r = M[a][b], n = r.games.length;
    var lead = r.w > r.l ? esc(a) + ' leads ' + rec(r.w, r.l, r.t) : r.l > r.w ? esc(b) + ' leads ' + rec(r.l, r.w, r.t) : 'Series tied ' + rec(r.w, r.l, r.t);
    var margins = r.games.map(function(x){ return x.pf - x.pa; });
    var big = r.games.slice().sort(function(x, y){ return Math.abs(y.pf - y.pa) - Math.abs(x.pf - x.pa); })[0];
    var last = r.games.slice(-5).map(function(x){ return x.pf > x.pa ? 'W' : x.pf < x.pa ? 'L' : 'T'; }).join(' ');
    detail = '<section class="panel"><h3>' + esc(a) + ' vs ' + esc(b) + '</h3>' +
      '<div class="facts">' +
      '<div class="fact"><div class="v">' + lead + '</div><div class="k">' + n + ' meetings</div></div>' +
      '<div class="fact"><div class="v">' + f1(r.pf / n) + ' – ' + f1(r.pa / n) + '</div><div class="k">Average score</div></div>' +
      '<div class="fact"><div class="v">' + sgn(margins.reduce(function(s, x){ return s + x; }, 0) / n) + '</div><div class="k">' + esc(a) + '\'s average margin</div></div>' +
      '<div class="fact"><div class="v">' + last + '</div><div class="k">' + esc(a) + '\'s last ' + Math.min(5, n) + ', oldest first</div></div>' +
      '</div><p class="muted" style="margin-bottom:10px">Biggest margin: ' + esc(big.pf > big.pa ? a : b) + ' by ' + f1(Math.abs(big.pf - big.pa)) + ' in ' + esc(when(big.g)) + '.</p>' +
      '<div class="scroll"><table><thead><tr><th>Game</th><th>' + esc(a) + '</th><th>' + esc(b) + '</th><th>Result</th><th>Margin</th></tr></thead><tbody>' +
      r.games.slice().reverse().map(function(x){
        var res = x.pf > x.pa ? 'W' : x.pf < x.pa ? 'L' : 'T';
        return '<tr><td>' + esc(when(x.g)) + '</td><td>' + f2(x.pf) + '</td><td>' + f2(x.pa) + '</td><td class="' + cls(x.pf - x.pa) + '">' + res + '</td><td class="' + cls(x.pf - x.pa) + '">' + sgn(x.pf - x.pa, 2) + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
  }
  return '<div class="stack"><section><h2>Head to head</h2><p class="lede">Each cell is the row manager\'s record against the column manager, counting ' + scopeWord() + '. Green means the row manager owns the matchup. Click a cell for the full game log.</p>' +
    '<div class="panel scroll"><table class="matrix"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></section>' +
    (detail || '<p class="muted">Pick a cell to see every game in that rivalry.</p>') + '</div>';
}

function viewManager(){
  var stats = managerStats(L, filter());
  if (!state.manager) state.manager = stats.slice().sort(function(a, b){ return b.titles - a.titles || b.winpct - a.winpct; })[0].m;
  var m = state.manager, r = stats.filter(function(x){ return x.m === m; })[0];
  var opts = L.managers.map(function(x){ return '<option' + (x === m ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
  var st = streaks(L, filter()).filter(function(x){ return x.m === m; })[0] || { bw:{ n:0 }, bl:{ n:0 }, cur:{ n:0 } };
  var seasonRows = L.seasons.map(function(s){
    var row = (L.seasonTables[s] || []).filter(function(x){ return x.m === m; })[0];
    if (!row) return '';
    var res = L.champs[s] === m ? '<span class="trophy">Champion</span>' : L.runners[s] === m ? 'Runner-up' : L.postSeasons[m + '|' + s] ? 'Playoffs' : '';
    return '<tr><td>' + s + '</td><td>' + row.rank + ' of ' + L.seasonTables[s].length + '</td><td>' + rec(row.w, row.l, row.t) + '</td><td>' + f1(row.pf) + '</td><td>' + f1(row.pa) + '</td><td>' + f1(row.pf / row.gp) + '</td><td class="' + cls(row.luck) + '">' + sgn(row.luck) + '</td><td>' + res + '</td></tr>';
  }).join('');
  var M = h2h(L, filter())[m] || {};
  var opp = Object.keys(M).map(function(o){ var x = M[o]; var n = x.w + x.l + x.t; return { o:o, x:x, n:n, p:(x.w + x.t / 2) / n }; })
    .sort(function(a, b){ return b.p - a.p || b.n - a.n; });
  var oppRows = opp.map(function(q){
    return '<tr><td class="name">' + esc(q.o) + '</td><td style="' + tint(q.p) + '">' + rec(q.x.w, q.x.l, q.x.t) + '</td><td>' + pct(q.p) + '</td><td>' + f1(q.x.pf / q.n) + '</td><td>' + f1(q.x.pa / q.n) + '</td><td class="' + cls((q.x.pf - q.x.pa) / q.n) + '">' + sgn((q.x.pf - q.x.pa) / q.n) + '</td></tr>';
  }).join('');
  var mine = [];
  L.games.forEach(function(g){ if (filter()(g)) sides(g).forEach(function(x){ if (x.m === m) mine.push(x); }); });
  var top = mine.slice().sort(function(a, b){ return b.pf - a.pf; }).slice(0, 5);
  var bot = mine.slice().sort(function(a, b){ return a.pf - b.pf; }).slice(0, 5);
  var li = function(x){ return '<li><span class="n">' + f2(x.pf) + '</span> <span class="d">vs ' + esc(x.o) + ' (' + f2(x.pa) + '), ' + esc(when(x.g)) + '</span></li>'; };
  var lg = L.seasons.map(function(s){ var t = L.seasonTables[s]; var pf = 0, gp = 0; t.forEach(function(x){ pf += x.pf; gp += x.gp; }); return gp ? pf / gp : null; });
  var mineAvg = L.seasons.map(function(s){ var row = (L.seasonTables[s] || []).filter(function(x){ return x.m === m; })[0]; return row ? row.pf / row.gp : null; });
  var nMed = opp.map(function(q){ return q.n; }).sort(function(a, b){ return a - b; })[Math.floor(opp.length / 2)] || 0;
  var solid = opp.filter(function(q){ return q.n >= Math.max(3, nMed / 2); }); if (solid.length < 2) solid = opp;
  var best = solid[0], worst = solid[solid.length - 1];
  var curTxt = st.cur.n ? (st.cur.n + (st.cur.k === 'W' ? ' win' : st.cur.k === 'L' ? ' loss' : ' tie') + (st.cur.n > 1 ? (st.cur.k === 'L' ? 'es' : 's') : '')) : '—';
  return '<div class="stack"><div class="pick"><h2 style="margin:0">Manager</h2><select id="pick-manager" aria-label="Choose a manager">' + opts + '</select></div>' +
    '<section class="panel"><div class="facts">' +
    '<div class="fact"><div class="v">' + rec(r.w, r.l, r.t) + '</div><div class="k">' + (state.scope === 'regular' ? 'Regular-season record' : 'Record incl. playoffs') + '</div></div>' +
    '<div class="fact"><div class="v">' + f1(r.ppg) + '</div><div class="k">Points per game</div></div>' +
    '<div class="fact"><div class="v' + (r.titles ? ' trophy' : '') + '">' + r.titles + '</div><div class="k">Titles (' + r.finals + ' finals)</div></div>' +
    '<div class="fact"><div class="v">' + r.npo + ' of ' + r.nseas + '</div><div class="k">Playoff seasons</div></div>' +
    '<div class="fact"><div class="v">' + rec(r.pw, r.pl) + '</div><div class="k">Playoff record</div></div>' +
    '<div class="fact"><div class="v">' + st.bw.n + ' / ' + st.bl.n + '</div><div class="k">Longest win / loss streak</div></div>' +
    '<div class="fact"><div class="v">' + curTxt + '</div><div class="k">Current streak</div></div>' +
    '</div>' +
    (opp.length > 1 ? '<p class="muted">Owns ' + esc(best.o) + ' (' + rec(best.x.w, best.x.l, best.x.t) + '). Can\'t beat ' + esc(worst.o) + ' (' + rec(worst.x.w, worst.x.l, worst.x.t) + ').</p>' : '') +
    '</section>' +
    '<section class="panel"><h3>Points per game by season</h3>' + lineChart({ xs:L.seasons, label:m + ' points per game by season vs league average', series:[{ name:m, values:mineAvg, color:'--c1' }, { name:'League average', values:lg, color:'--c5' }] }) + '</section>' +
    '<section class="panel scroll"><h3>Season by season</h3><table><thead><tr><th>Season</th><th>Finish</th><th>Record</th><th>Points for</th><th>Against</th><th>Pts/game</th><th>Luck</th><th>Result</th></tr></thead><tbody>' + seasonRows + '</tbody></table></section>' +
    '<section class="panel scroll"><h3>Against each opponent</h3><table><thead><tr><th>Opponent</th><th>Record</th><th>Win %</th><th>Scored/game</th><th>Allowed/game</th><th>Margin</th></tr></thead><tbody>' + oppRows + '</tbody></table></section>' +
    '<div class="grid2"><section class="panel"><h3>Best games</h3><ol class="rec">' + top.map(li).join('') + '</ol></section>' +
    '<section class="panel"><h3>Worst games</h3><ol class="rec">' + bot.map(li).join('') + '</ol></section></div></div>';
}

function viewRecords(){
  var F = filter(), all = [], games = L.games.filter(F);
  games.forEach(function(g){ sides(g).forEach(function(x){ all.push(x); }); });
  function top(arr, key, n){ return arr.slice().sort(key).slice(0, n || 5); }
  function list(title, items, fmt){ return '<section class="panel"><h3>' + title + '</h3><ol class="rec">' + items.map(fmt).join('') + '</ol></section>'; }
  var side = function(x){ return '<li><b>' + esc(x.m) + '</b><span class="n">' + f2(x.pf) + '</span><span class="d">vs ' + esc(x.o) + ' (' + f2(x.pa) + '), ' + esc(when(x.g)) + '</span></li>'; };
  var game = function(val){ return function(g){ var w = g.sa >= g.sb; return '<li><b>' + esc(w ? g.a : g.b) + '</b> over ' + esc(w ? g.b : g.a) + '<span class="n">' + val(g) + '</span><span class="d">' + f2(Math.max(g.sa, g.sb)) + ' to ' + f2(Math.min(g.sa, g.sb)) + ', ' + esc(when(g)) + '</span></li>'; }; };
  var st = streaks(L, F);
  var span = function(s){ return s.start ? (s.start.season === s.end.season ? s.start.season + ', weeks ' + s.start.week + '–' + s.end.week : s.start.season + ' wk ' + s.start.week + ' to ' + s.end.season + ' wk ' + s.end.week) : ''; };
  var seasonRows = [];
  L.seasons.forEach(function(s){ L.seasonTables[s].forEach(function(r){ seasonRows.push({ s:s, r:r }); }); });
  var sr = function(val, sub){ return function(x){ return '<li><b>' + esc(x.r.m) + '</b><span class="n">' + val(x) + '</span><span class="d">' + x.s + ', ' + sub(x) + '</span></li>'; }; };
  return '<div class="stack"><section><h2>Record book</h2><p class="lede">Top five in each category, counting ' + scopeWord() + '. Season records always use the regular season.</p></section><div class="grid2">' +
    list('Highest scores', top(all, function(a, b){ return b.pf - a.pf; }), side) +
    list('Lowest scores', top(all, function(a, b){ return a.pf - b.pf; }), side) +
    list('Biggest blowouts', top(games, function(a, b){ return Math.abs(b.sa - b.sb) - Math.abs(a.sa - a.sb); }), game(function(g){ return f2(Math.abs(g.sa - g.sb)); })) +
    list('Closest games', top(games, function(a, b){ return Math.abs(a.sa - a.sb) - Math.abs(b.sa - b.sb); }), game(function(g){ return f2(Math.abs(g.sa - g.sb)); })) +
    list('Most points in a loss', top(all.filter(function(x){ return x.pf < x.pa; }), function(a, b){ return b.pf - a.pf; }), side) +
    list('Fewest points in a win', top(all.filter(function(x){ return x.pf > x.pa; }), function(a, b){ return a.pf - b.pf; }), side) +
    list('Highest combined scores', top(games, function(a, b){ return (b.sa + b.sb) - (a.sa + a.sb); }), game(function(g){ return f2(g.sa + g.sb); })) +
    list('Lowest combined scores', top(games, function(a, b){ return (a.sa + a.sb) - (b.sa + b.sb); }), game(function(g){ return f2(g.sa + g.sb); })) +
    list('Longest winning streaks', top(st, function(a, b){ return b.bw.n - a.bw.n; }), function(x){ return '<li><b>' + esc(x.m) + '</b><span class="n">' + x.bw.n + '</span><span class="d">' + span(x.bw) + '</span></li>'; }) +
    list('Longest losing streaks', top(st, function(a, b){ return b.bl.n - a.bl.n; }), function(x){ return '<li><b>' + esc(x.m) + '</b><span class="n">' + x.bl.n + '</span><span class="d">' + span(x.bl) + '</span></li>'; }) +
    list('Most points in a season', top(seasonRows, function(a, b){ return b.r.pf / b.r.gp - a.r.pf / a.r.gp; }), sr(function(x){ return f1(x.r.pf); }, function(x){ return f1(x.r.pf / x.r.gp) + ' per game'; })) +
    list('Best regular-season records', top(seasonRows, function(a, b){ return b.r.winpct - a.r.winpct || b.r.pf - a.r.pf; }), sr(function(x){ return rec(x.r.w, x.r.l, x.r.t); }, function(x){ return f1(x.r.pf) + ' points' + (L.champs[x.s] === x.r.m ? ', won the title' : ''); })) +
    list('Unluckiest seasons', top(seasonRows, function(a, b){ return a.r.luck - b.r.luck; }), sr(function(x){ return sgn(x.r.luck); }, function(x){ return rec(x.r.w, x.r.l, x.r.t) + ' but all-play ' + pct(x.r.ap); })) +
    list('Luckiest seasons', top(seasonRows, function(a, b){ return b.r.luck - a.r.luck; }), sr(function(x){ return sgn(x.r.luck); }, function(x){ return rec(x.r.w, x.r.l, x.r.t) + ' but all-play ' + pct(x.r.ap); })) +
    '</div></div>';
}

function viewTrends(){
  var S = L.seasons;
  var lg = S.map(function(s){ var pf = 0, gp = 0; L.seasonTables[s].forEach(function(x){ pf += x.pf; gp += x.gp; }); return gp ? pf / gp : null; });
  var bestTeam = S.map(function(s){ return Math.max.apply(null, L.seasonTables[s].map(function(x){ return x.pf / x.gp; })); });
  var worstTeam = S.map(function(s){ return Math.min.apply(null, L.seasonTables[s].map(function(x){ return x.pf / x.gp; })); });
  var stats = managerStats(L, isReg);
  if (!state.picks) state.picks = stats.slice().sort(function(a, b){ return b.winpct - a.winpct; }).slice(0, 3).map(function(r){ return r.m; });
  var colorOf = {}; state.picks.forEach(function(m, i){ colorOf[m] = PALETTE[i % PALETTE.length]; });
  var chips = L.managers.map(function(m){
    var on = state.picks.indexOf(m) >= 0;
    return '<button type="button" class="chip" data-pick="' + esc(m) + '" aria-pressed="' + on + '"' + (on ? ' style="color:var(' + colorOf[m] + ')"' : '') + '>' + esc(m) + '</button>';
  }).join('');
  function perSeason(fn){ return L.managers.map(function(m){ return { name:m, values:S.map(function(s){ var row = L.seasonTables[s].filter(function(x){ return x.m === m; })[0]; return row ? fn(row, s) : null; }), color:colorOf[m], faint:!colorOf[m] }; }); }
  var ranked = stats.filter(function(r){ return r.nseas; }).map(function(r){
    var ranks = S.map(function(s){ var row = L.seasonTables[s].filter(function(x){ return x.m === r.m; })[0]; return row ? row.rank : null; });
    var got = ranks.filter(function(x){ return x != null; });
    return { m:r.m, ranks:ranks, avg:got.reduce(function(a, b){ return a + b; }, 0) / got.length };
  }).sort(function(a, b){ return a.avg - b.avg; });
  var heat = '<table class="heat"><thead><tr><th>Manager</th>' + S.map(function(s){ return '<th>' + s + '</th>'; }).join('') + '<th>Avg finish</th></tr></thead><tbody>' +
    ranked.map(function(r){
      return '<tr><td class="name">' + esc(r.m) + '</td>' + r.ranks.map(function(k, i){
        if (k == null) return '<td class="muted">–</td>';
        var n = L.seasonTables[S[i]].length, champ = L.champs[S[i]] === r.m;
        return '<td class="' + (champ ? 'champ' : '') + '" style="' + tint(1 - (k - 1) / Math.max(1, n - 1)) + '"' + (champ ? ' title="Won the title"' : '') + '>' + k + '</td>';
      }).join('') + '<td>' + f1(r.avg) + '</td></tr>';
    }).join('') + '</tbody></table>';
  return '<div class="stack"><section><h2>Trends</h2><p class="lede">All trend views use regular-season games only.</p></section>' +
    '<section class="panel"><h3>League scoring by season</h3><p class="muted">Average points per team per week, with the best and worst team averages that year.</p>' +
    lineChart({ xs:S, label:'League scoring by season', series:[{ name:'Best team', values:bestTeam, color:'--c3' }, { name:'League average', values:lg, color:'--c1' }, { name:'Worst team', values:worstTeam, color:'--c2' }] }) + '</section>' +
    '<section class="panel"><h3>Compare managers</h3><p class="muted" style="margin-bottom:10px">Pick up to six. Everyone else stays in grey for context.</p><div class="chips">' + chips + '</div>' +
    '<div class="grid2"><div><h3 style="font-size:17px">Points per game</h3>' + lineChart({ xs:S, height:300, label:'Points per game by season', series:perSeason(function(r){ return r.pf / r.gp; }) }) + '</div>' +
    '<div><h3 style="font-size:17px">Regular-season finish</h3>' + lineChart({ xs:S, height:300, invert:true, min:1, step:Math.max(1, Math.ceil(Math.max.apply(null, S.map(function(s){ return L.seasonTables[s].length; })) / 6)), label:'Regular-season finish by season, first at the top', fmt:function(v){ return 'finished ' + v; }, series:perSeason(function(r){ return r.rank; }) }) + '</div></div></section>' +
    '<section class="panel scroll"><h3>Finish by season</h3><p class="muted" style="margin-bottom:10px">Regular-season rank. Gold outline marks the champion.</p>' + heat + '</section></div>';
}

function viewSeasons(){
  var s = state.season, t = L.seasonTables[s] || [];
  var opts = L.seasons.slice().reverse().map(function(x){ return '<option' + (x === s ? ' selected' : '') + '>' + x + '</option>'; }).join('');
  var sg = L.games.filter(function(g){ return g.season === s && g.type !== 'consolation'; }), sides_ = [];
  sg.forEach(function(g){ sides(g).forEach(function(x){ sides_.push(x); }); });
  var hi = sides_.slice().sort(function(a, b){ return b.pf - a.pf; })[0];
  var lo = sides_.slice().sort(function(a, b){ return a.pf - b.pf; })[0];
  var avg = t.reduce(function(a, r){ return a + r.pf; }, 0) / Math.max(1, t.reduce(function(a, r){ return a + r.gp; }, 0));
  var post = L.games.filter(function(g){ return g.season === s && g.type !== 'regular'; }).sort(function(a, b){ return a.week - b.week; });
  var body = t.map(function(r){
    var tag = L.champs[s] === r.m ? ' <span class="trophy">Champion</span>' : L.runners[s] === r.m ? ' <span class="muted">Runner-up</span>' : '';
    return '<tr><td>' + r.rank + '</td><td class="name">' + esc(r.m) + tag + '</td><td>' + rec(r.w, r.l, r.t) + '</td><td>' + f1(r.pf) + '</td><td>' + f1(r.pa) + '</td><td>' + f1(r.pf / r.gp) + '</td><td>' + pct(r.ap) + '</td><td class="' + cls(r.luck) + '">' + sgn(r.luck) + '</td></tr>';
  }).join('');
  return '<div class="stack"><div class="pick"><h2 style="margin:0">Season</h2><select id="pick-season" aria-label="Choose a season">' + opts + '</select></div>' +
    '<section class="panel"><div class="facts">' +
    '<div class="fact"><div class="v trophy">' + esc(L.champs[s] || '—') + '</div><div class="k">Champion</div></div>' +
    '<div class="fact"><div class="v">' + f1(avg) + '</div><div class="k">League average per week</div></div>' +
    (hi ? '<div class="fact"><div class="v">' + f2(hi.pf) + '</div><div class="k">High score: ' + esc(hi.m) + ', week ' + hi.g.week + '</div></div>' : '') +

    '<section class="panel scroll"><h3>Regular-season standings</h3><table><thead><tr><th>#</th><th>Manager</th><th>Record</th><th>Points for</th><th>Against</th><th>Pts/game</th><th>All-play %</th><th>Luck</th></tr></thead><tbody>' + body + '</tbody></table></section>' +
    (post.length ? '<section class="panel scroll"><h3>Postseason</h3><table><thead><tr><th>Week</th><th>Game</th><th>Winner</th><th>Loser</th><th>Score</th></tr></thead><tbody>' +
      post.map(function(g){ var w = g.sa >= g.sb; return '<tr><td>' + g.week + '</td><td>' + (g.type === 'final' ? '<span class="trophy">Title game</span>' : g.type === 'playoff' ? 'Playoffs' : 'Consolation') + '</td><td class="name">' + esc(w ? g.a : g.b) + '</td><td>' + esc(w ? g.b : g.a) + '</td><td>' + f2(Math.max(g.sa, g.sb)) + ' – ' + f2(Math.min(g.sa, g.sb)) + '</td></tr>'; }).join('') +
      '</tbody></table></section>' : '') + '</div>';

/* ---------------- this week ---------------- */
function mean(xs){ return xs.reduce(function(a, b){ return a + b; }, 0) / xs.length; }
function Phi(z){
  var x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);
  var erf = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return z >= 0 ? (1 + erf) / 2 : (1 - erf) / 2;
}
function counted(){ return L.games.filter(function(g){ return g.type !== 'consolation'; }); }
function before(g, s, w){ return g.season < s || (g.season === s && g.week <= w); }
function ordinal(n){ var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function standingsThrough(s, w){
  var t = {};
  L.games.forEach(function(g){
    if (g.season !== s || !isReg(g) || g.week > w) return;
    sides(g).forEach(function(x){
      var r = t[x.m] = t[x.m] || { m:x.m, w:0, l:0, t:0, pf:0, gp:0 };
      r.gp++; r.pf += x.pf;
      if (x.pf > x.pa) r.w++; else if (x.pf < x.pa) r.l++; else r.t++;
    });
  });
  var rows = Object.keys(t).map(function(m){ var r = t[m]; r.winpct = (r.w + r.t / 2) / r.gp; return r; });
  rows.sort(function(a, b){ return b.winpct - a.winpct || b.pf - a.pf; });
  rows.forEach(function(r, i){ r.rank = i + 1; });
  return rows;
}
function streakThrough(m, s, w){
  var list = [];
  counted().forEach(function(g){ if (before(g, s, w)) sides(g).forEach(function(x){ if (x.m === m) list.push(x); }); });
  var k = null, n = 0;
  for (var i = list.length - 1; i >= 0; i--) {
    var r = list[i].pf > list[i].pa ? 'W' : list[i].pf < list[i].pa ? 'L' : 'T';
    if (k === null) k = r;
    if (r !== k) break;
    n++;
  }
  return { k:k, n:n };
}
function streakWord(st){ return st.n + (st.k === 'W' ? ' straight win' : st.k === 'L' ? ' straight loss' : ' straight tie') + (st.n > 1 ? (st.k === 'L' ? 'es' : 's') : ''); }
function seriesThrough(a, b, s, w){
  var r = { w:0, l:0, t:0, games:[] };
  counted().forEach(function(g){
    if (s != null && !before(g, s, w)) return;
    if (!((g.a === a && g.b === b) || (g.a === b && g.b === a))) return;
    var x = g.a === a ? sides(g)[0] : sides(g)[1];
    if (x.pf > x.pa) r.w++; else if (x.pf < x.pa) r.l++; else r.t++;
    r.games.push(x);
  });
  var k = null, n = 0;
  for (var i = r.games.length - 1; i >= 0; i--) {
    var y = r.games[i], who = y.pf > y.pa ? a : y.pf < y.pa ? b : null;
    if (k === null) k = who;
    if (who !== k || who === null) break;
    n++;
  }
  r.streak = { who:k, n:n };
  return r;
}
function seriesText(a, b, r){
  if (!r.games.length) return 'first meeting';
  if (r.w === r.l) return 'series tied ' + rec(r.w, r.l, r.t);
  return r.w > r.l ? a + ' leads the series ' + rec(r.w, r.l, r.t) : b + ' leads the series ' + rec(r.l, r.w, r.t);
}

function scoreSD(){
  if (L._sd) return L._sd;
  L._sd = scoreSD0();
  return L._sd;
}
function scoreSD0(){
  var xs = [], recent = L.seasons.slice(-3);
  L.games.forEach(function(g){ if (isReg(g) && recent.indexOf(g.season) >= 0) xs.push(g.sa, g.sb); });
  if (xs.length < 20) return 25;
  var m = mean(xs);
  return Math.sqrt(xs.reduce(function(a, x){ return a + (x - m) * (x - m); }, 0) / (xs.length - 1));
}
function project(m, s, w){
  var cur = [];
  L.games.forEach(function(g){ if (g.season === s && g.week < w && (isReg(g) || isPost(g))) sides(g).forEach(function(x){ if (x.m === m) cur.push(x.pf); }); });
  var prevT = L.seasonTables[s - 1] || [];
  var prevRow = prevT.filter(function(r){ return r.m === m; })[0];
  var lgPrev = prevT.length ? prevT.reduce(function(a, r){ return a + r.pf; }, 0) / prevT.reduce(function(a, r){ return a + r.gp; }, 0) : null;
  if (lgPrev == null) { var lg = []; L.games.forEach(function(g){ if (isReg(g)) lg.push(g.sa, g.sb); }); lgPrev = lg.length ? mean(lg) : 110; }
  var prior = prevRow ? lgPrev + 0.4 * (prevRow.pf / prevRow.gp - lgPrev) : lgPrev;
  var n = cur.length, avg = n ? mean(cur) : null;
  var sdv = scoreSD(), lo = lgPrev - 2 * sdv, hi = lgPrev + 2 * sdv;
  var damp = cur.map(function(x){ return Math.max(lo, Math.min(hi, x)); });
  var est = (n ? damp.reduce(function(a, x){ return a + x; }, 0) : 0) / (n + 5) + 5 * prior / (n + 5);
  cur = damp;
  var last3 = cur.slice(-3);
  return { proj: last3.length === 3 ? 0.7 * est + 0.3 * mean(last3) : est, n:n, avg:avg, last3: last3.length ? mean(last3) : null, prior:prior };
}

var ESPN_WEIGHT = 0.7;
function forecast(g){
  var A = project(g.a, g.season, g.week), B = project(g.b, g.season, g.week);
  [[A, g.pa], [B, g.pb]].forEach(function(x){
    var X = x[0];
    X.hist = X.proj;
    X.espn = x[1] > 0 ? x[1] : null;
    if (X.espn != null) X.proj = ESPN_WEIGHT * X.espn + (1 - ESPN_WEIGHT) * X.hist;
  });
  return { A:A, B:B, pA:Phi((A.proj - B.proj) / (scoreSD() * Math.SQRT2)) };
}
function recapData(){
  var pl = counted();
  if (!pl.length) return null;
  var last = pl[pl.length - 1], s = last.season, w = last.week;
  var games = pl.filter(function(g){ return g.season === s && g.week === w; });
  var ws = [];
  games.forEach(function(g){ sides(g).forEach(function(x){ ws.push(x); }); });
  var allSides = [];
  pl.forEach(function(g){ sides(g).forEach(function(x){ allSides.push(x); }); });
  var reg = games.every(isReg);
  ws.forEach(function(x){
    x.beat = ws.filter(function(y){ return y !== x && y.pf < x.pf; }).length;
    x.allTimeRank = allSides.filter(function(y){ return y.pf > x.pf; }).length + 1;
    var mine = allSides.filter(function(y){ return y.m === x.m; });
    x.careerHigh = mine.length > 8 && mine.every(function(y){ return y.pf <= x.pf; });
    x.careerLow = mine.length > 8 && mine.every(function(y){ return y.pf >= x.pf; });
    var seasonSides = allSides.filter(function(y){ return y.g.season === s; });
    x.seasonHigh = seasonSides.length > ws.length && seasonSides.every(function(y){ return y.pf <= x.pf; });
    x.streak = streakThrough(x.m, s, w);
  });
  var rows = games.map(function(g){
    var two = sides(g).sort(function(p, q){ return q.pf - p.pf; });
    var W = ws.filter(function(x){ return x.g === g && x.m === two[0].m; })[0];
    var Lo = ws.filter(function(x){ return x.g === g && x.m === two[1].m; })[0];
    var notes = [];
    if (g.type === 'final') notes.push(W.m + ' wins the ' + s + ' title');
    else if (g.type === 'playoff') notes.push('Playoffs');
    [W, Lo].forEach(function(x){
      if (x.allTimeRank <= 5) notes.push(x.m + '\'s ' + f2(x.pf) + ' is the ' + ordinal(x.allTimeRank) + '-highest score in league history');
      else if (x.careerHigh) notes.push('Career high for ' + x.m);
      else if (x.seasonHigh) notes.push('Season high for ' + x.m);
      if (x.careerLow) notes.push('Career low for ' + x.m);
      if (x.streak.n >= 3) notes.push(x.m + ' has ' + streakWord(x.streak) + (x.streak.k === 'W' ? '' : ''));
    });
    var ser = seriesThrough(W.m, Lo.m, s, w);
    notes.push(seriesText(W.m, Lo.m, ser));
    return { g:g, W:W, Lo:Lo, margin:W.pf - Lo.pf, notes:notes };
  }).sort(function(a, b){ return b.W.pf - a.W.pf; });
  var by = function(f){ return ws.slice().sort(f)[0]; };
  var losers = ws.filter(function(x){ return x.pf < x.pa; }), winners = ws.filter(function(x){ return x.pf > x.pa; });
  return {
    s:s, w:w, reg:reg, rows:rows, n:ws.length,
    top: by(function(a, b){ return b.pf - a.pf; }),
    bottom: by(function(a, b){ return a.pf - b.pf; }),
    unlucky: losers.sort(function(a, b){ return b.pf - a.pf; })[0],
    lucky: winners.sort(function(a, b){ return a.pf - b.pf; })[0],
    blowout: rows.slice().sort(function(a, b){ return b.margin - a.margin; })[0],
    closest: rows.slice().sort(function(a, b){ return a.margin - b.margin; })[0],
    avg: mean(ws.map(function(x){ return x.pf; }))
  };
}

function previewData(){
  if (!L.upcoming.length) return null;
  var s = L.upcoming[0].season, w = L.upcoming[0].week;
  var games = L.upcoming.filter(function(g){ return g.season === s && g.week === w; });
  var sd = scoreSD(), table = standingsThrough(s, w - 1);
  var rankOf = function(m){ var r = table.filter(function(x){ return x.m === m; })[0]; return r ? r : null; };
  var cards = games.map(function(g){
    var F = forecast(g), A = F.A, B = F.B, pA = F.pA;
    var ser = seriesThrough(g.a, g.b, null, null);
    var ra = rankOf(g.a), rb = rankOf(g.b);
    var story = [];
    story.push(seriesText(g.a, g.b, ser).replace(/^./, function(c){ return c.toUpperCase(); }) + (ser.games.length ? '.' : ' in league records.'));
    if (ser.streak.n >= 3) story.push(ser.streak.who + ' has won the last ' + ser.streak.n + ' meetings.');
    if (ser.games.length) {
      var lm = ser.games[ser.games.length - 1];
      story.push('Last meeting: ' + (lm.pf > lm.pa ? g.a : g.b) + ' won ' + f2(Math.max(lm.pf, lm.pa)) + ' to ' + f2(Math.min(lm.pf, lm.pa)) + ' (' + lm.g.season + ', week ' + lm.g.week + ').');
      var big = ser.games.filter(function(x){ return x.g.type === 'final' || x.g.type === 'playoff'; });
      big.forEach(function(x){ story.push('Rematch of the ' + x.g.season + ' ' + (x.g.type === 'final' ? 'title game' : 'playoffs') + ', won by ' + (x.pf > x.pa ? g.a : g.b) + '.'); });
    }
    [g.a, g.b].forEach(function(m){
      var st = streakThrough(m, s, w - 1);
      if (st.n >= 3) story.push(m + ' brings a ' + st.n + '-game ' + (st.k === 'W' ? 'winning' : st.k === 'L' ? 'losing' : 'tie') + ' streak.');
    });
    if (ra && rb && ra.gp >= 3 && rb.gp >= 3 && ra.rank <= 3 && rb.rank <= 3 && table.length >= 6) story.push('Top-three matchup in the standings.');
    return { g:g, A:A, B:B, pA:pA, ra:ra, rb:rb, story:story, ser:ser };
  });
  var gotw = cards.slice().sort(function(x, y){
    var sx = x.A.proj + x.B.proj - 3 * Math.abs(x.A.proj - x.B.proj), sy = y.A.proj + y.B.proj - 3 * Math.abs(y.A.proj - y.B.proj);
    return sy - sx;
  })[0];
  cards.sort(function(x, y){ return (y === gotw) - (x === gotw) || Math.abs(x.pA - 0.5) - Math.abs(y.pA - 0.5); });
  return { s:s, w:w, cards:cards, gotw:gotw, sd:sd };
}

}

function autoSeasonC(){ if (SERVER) return (SERVER.lines || {}).season || null; if (!('s' in autoCache)) autoCache.s = autoSeason(); return autoCache.s; }
function autoFor(mk){
  if (mk.split('|')[1] === 'season') { var as = autoSeasonC(); return as && as.mk === mk ? as : null; }
  var aw = autoWeekC(); return aw && aw.mk === mk ? aw : null;
}
function manualLines(mk){ return ((D().book || {}).posted || {})[mk] || null; }
function posted(mk){
  var p = manualLines(mk);
  if (p) return { mk:mk, at:p.at, markets:p.markets, manual:true };
  var a = autoFor(mk);
  return a ? { mk:mk, at:null, markets:a.markets, manual:false } : null;
}
function bets(){ return (D().book || {}).bets || []; }
function marketLocked(mk){
  var p = mk.split('|'), s = +p[0];
  if (p[1] === 'season') { var info = seasonInfo(); return info.s !== s || info.started || info.done; }
  return weekLocked(s, +p[1]);
}
function gradeBet(b){
  if (b.grade) return b.grade;
  var kind = b.market.split('|')[0];
  if (kind === 'ml' || kind === 'sp' || kind === 'tot') {
    var key = b.market.slice(kind.length + 1);
    var g = L.games.filter(function(x){ return x.type !== 'consolation' && gkey(x) === key; })[0];
    if (!g) return null;
    if (kind === 'tot') { var tot = g.sa + g.sb; return tot === b.line ? 'push' : ((b.side === 'o') === (tot > b.line) ? 'win' : 'loss'); }
    if (b.team !== g.a && b.team !== g.b) return 'void';
    var ts = b.team === g.a ? g.sa : g.sb, os = b.team === g.a ? g.sb : g.sa;
    var m = kind === 'ml' ? ts - os : ts - os + b.line;
    return m > 0 ? 'win' : m < 0 ? 'loss' : 'push';
  }
  var s = +b.market.split('|')[1];
  if (!L.champs[s]) return null;
  var table = L.seasonTables[s] || [];
  if (kind === 'title') return L.champs[s] === b.team ? 'win' : 'loss';
  if (kind === 'pf') { var top = table.slice().sort(function(x, y){ return y.pf - x.pf; })[0]; return top && top.m === b.team ? 'win' : 'loss'; }
  if (kind === 'po') return (b.side === 'y') === !!L.postSeasons[b.team + '|' + s] ? 'win' : 'loss';
  if (kind === 'wins') { var r = table.filter(function(x){ return x.m === b.team; })[0]; if (!r) return 'void'; var wv = r.w + r.t / 2; return wv === b.line ? 'push' : ((b.side === 'o') === (wv > b.line) ? 'win' : 'loss'); }
  return null;
}
function weeksPlayed(season){
  var wk = {};
  L.games.forEach(function(g){ if (g.season === season && g.type !== 'consolation') wk[g.week] = 1; });
  return Object.keys(wk).length;
}
function ledger(season){
  var c = cfg(), rows = {}, bonus = c.topUp * weeksPlayed(season);
  L.managers.forEach(function(m){ rows[m] = { m:m, start:c.bankroll + bonus, bonus:bonus, pl:0, risk:0, pending:0, w:0, l:0, p:0, bets:0 }; });
  bets().forEach(function(b){
    if (+b.mk.split('|')[0] !== season) return;
    var r = rows[b.who];
    if (!r) return;
    if (b.status === 'pending') { r.pending += b.stake; return; }
    if (b.status !== 'open') return;
    var gr = gradeBet(b);
    r.bets++;
    if (!gr) r.risk += b.stake;
    else if (gr === 'win') { r.pl += profit(b.stake, b.price); r.w++; }
    else if (gr === 'loss') { r.pl -= b.stake; r.l++; }
    else if (gr === 'push') r.p++;
  });
  Object.keys(rows).forEach(function(m){ var r = rows[m]; r.balance = r.start + r.pl; r.avail = r.balance - r.risk - r.pending; });
  return rows;
}
function sideLine(m, sd){
  if (m.kind === 'sp') return fmtSpread(sd.line);
  if (m.kind === 'po') return sd.label;
  if (sd.line != null) return (sd.id === 'o' ? 'O ' : 'U ') + sd.line.toFixed(1);
  return '';
}
function betLabel(b){
  var kind = b.market.split('|')[0];
  if (kind === 'ml') return b.team + ' to win';
  if (kind === 'sp') return b.team + ' ' + fmtSpread(b.line);
  if (kind === 'tot') return (b.side === 'o' ? 'Over ' : 'Under ') + b.line.toFixed(1) + ' total points';
  if (kind === 'title') return b.team + ' to win the title';
  if (kind === 'pf') return b.team + ' to lead the league in points';
  if (kind === 'wins') return b.team + (b.side === 'o' ? ' over ' : ' under ') + b.line.toFixed(1) + ' wins';
  if (kind === 'po') return b.team + (b.side === 'y' ? ' to make the playoffs' : ' to miss the playoffs');
  return b.label;
}

    a.race.map(function(r){

function findSel(){

function addCodes(){
  var found = (codesText.match(/RB1-[A-Za-z0-9+\/]+/g) || []);
  if (!found.length) { toast('No codes found. They start with RB1-.', 'err'); return; }
  var added = 0, skipped = [];
  edit(function(d){
    d.book = d.book || { posted:{}, bets:[] };
    d.book.bets = d.book.bets || [];
    found.forEach(function(txt){
      var o = decodeCode(txt);
      if (!o || !o.who || L.managers.indexOf(o.who) < 0) { skipped.push('an unreadable code'); return; }
      var A = authOn(d);
      if (A) {
        var key = keyFor(A, o.who);
        if (!A.users[o.who]) { skipped.push(o.who + '\'s code (no password set for that team)'); return; }
        if (!key) { skipped.push(o.who + '\'s code (this device doesn\'t have their password; restore it under Team passwords)'); return; }
        if (!verifySig(o, key)) { skipped.push(o.who + '\'s code (it wasn\'t signed with ' + o.who + '\'s password)'); return; }
      }
      if (o.t === 'pick') {
        var lt = lockTime(o.s, o.w);
        if (lt && o.at > lt && !lateOk) { skipped.push(o.who + '\'s late picks'); return; }
        applyPick(d, o); added++;
      } else if (o.t === 'bet') {
        if (d.book.bets.some(function(b){ return b.id === o.id; })) { skipped.push(o.who + '\'s duplicate bet'); return; }
        if (againstSelf(o.who, o.market, o.side, o.team)) { skipped.push(o.who + '\'s bet against their own team'); return; }
        var isSeason = o.mk.split('|')[1] === 'season';
        var lockT = isSeason ? null : lockTime(+o.mk.split('|')[0], +o.mk.split('|')[1]);
        if (!lateOk && ((lockT && o.at > lockT) || marketLocked(o.mk))) { skipped.push(o.who + '\'s late bet'); return; }
        d.book.bets.push({ id:o.id, who:o.who, mk:o.mk, market:o.market, side:o.side, team:o.team, line:o.line, price:o.price, stake:o.stake, at:o.at, status:'open' });
        added++;
      } else skipped.push('an unknown code');
    });
  });
  codesText = '';
  toast('Added ' + added + '.' + (skipped.length ? ' Skipped ' + skipped.join(', ') + '.' : '') + (added ? ' Save changes to keep them.' : ''), skipped.length ? 'err' : 'ok');
}
