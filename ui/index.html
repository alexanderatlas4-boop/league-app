    (here.length ? '<button type="button" class="btn" data-act="pw-copy">Copy password list</button>' : '') +
    '<button type="button" class="btn" data-act="pw-off">Turn passwords off</button></div>' +
    '<details class="more"><summary>Restore passwords on this device</summary><p class="muted">Paste the password list you copied earlier (one "Team: password" per line).</p><textarea id="pw-restore" rows="4" class="code" spellcheck="false">' + esc(pwRestore) + '</textarea><div class="actions" style="justify-content:flex-start"><button type="button" class="btn" data-act="pw-restore">Restore</button></div></details>';
  return out + '</div>';
}
function serverAdminBlock(){
  return '<div class="mgr-block"><h3>Data</h3><p class="muted">' + esc(SERVER.last_refresh || 'No data pulled yet.') + ' The weekly job pulls ESPN every Tuesday morning.</p>' +
    '<div class="actions" style="justify-content:flex-start;align-items:center"><label class="check">From season <input type="number" id="srv-start" value="' + curSeason() + '" style="width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"></label>' +
    '<button type="button" class="btn primary" data-act="srv-refresh">Pull from ESPN now</button><button type="button" class="btn" data-act="srv-import">Import a CSV or change names</button></div></div>' +
    '<div class="mgr-block"><h3>Passwords</h3><p class="muted">Every team starts with its team name as the password. People can change their own after signing in; reset anyone\'s here.</p>' +
    '<div class="actions" style="justify-content:flex-start;align-items:center"><select id="srv-pw-team" aria-label="Team">' + L.managers.map(function(m){ return '<option>' + esc(m) + '</option>'; }).join('') + '</select>' +
    '<input type="text" id="srv-pw-val" class="pw-custom" placeholder="Blank = team name" aria-label="New password"><button type="button" class="btn" data-act="srv-pw-reset">Set password</button></div></div>' +
    '<div class="mgr-block"><button type="button" class="btn" data-act="srv-admin-off">Lock commissioner tools</button></div>';
}
function passwordList(){ var A = authOn(); return L.managers.filter(function(m){ return keyFor(A, m); }).map(function(m){ return m + ': ' + keyFor(A, m); }).join('\n'); }
function authClick(act, t){
  if (SERVER) {
    var v = function(id){ return ($(id) || {}).value || ''; };
    if (act === 'signin') { doSignin(); return true; }
    if (act === 'srv-signout' || act === 'signout') { pwOpen = false; sendAction({ type:'signout' }); return true; }
    if (act === 'srv-pw-open') { pwOpen = !pwOpen; render(); return true; }
    if (act === 'srv-pw-save') { sendAction({ type:'password', password:v('#srv-newpw') }); pwOpen = false; return true; }
    if (act === 'srv-admin-open') { adminOpen = !adminOpen; render(); return true; }
    if (act === 'srv-admin') { sendAction({ type:'admin', password:v('#srv-admin-pw') }); adminOpen = false; return true; }
    if (act === 'srv-admin-off') { sendAction({ type:'admin_off' }); return true; }
    if (act === 'srv-refresh') { sendAction({ type:'refresh', start:+v('#srv-start') || 0 }); return true; }
    if (act === 'srv-import') { $('#open-import').click(); return true; }
    if (act === 'srv-pw-reset') { sendAction({ type:'pw_reset', team:v('#srv-pw-team'), password:v('#srv-pw-val') }); return true; }
  }
  if (act === 'signin') doSignin();
  else if (act === 'signout') { lsSet('rb-session', null); sessionOk = {}; pickCode = ''; betCode = ''; slip = null; render(); }
  else if (act === 'pw-setup') {
    var salt = newKey().replace('-', '') + newKey().replace('-', ''), keys = loadKeys(), users = {};
    L.managers.forEach(function(m){ keys[m] = newKey(); users[m] = hashKey({ salt:salt }, m, keys[m]); });
    saveKeys(keys); pwShow = true;
    edit(function(d){ d.auth = { salt:salt, users:users }; });
    toast('Passwords created. Save changes, copy the list somewhere safe, then send each person theirs privately.', 'ok');
  }
  else if (act === 'pw-new') {
    var m = t.dataset.m, k2 = loadKeys(), key = newKey();
    k2[m] = key; saveKeys(k2); pwShow = true;
    edit(function(d){ d.auth.users[m] = hashKey(d.auth, m, key); });
    toast('New password for ' + m + '. Save changes, then send it to them.', 'ok');
  }
  else if (act === 'pw-set') {
    var who = t.dataset.m, inp = document.querySelector('.pw-custom[data-pwm="' + (window.CSS && CSS.escape ? CSS.escape(who) : who) + '"]');
    var val = normKey(inp ? inp.value : '');
    if (val.length < 4) { toast('Passwords need at least 4 characters.', 'err'); return true; }
    var k4 = loadKeys(); k4[who] = val; saveKeys(k4); pwShow = true;
    edit(function(d){ d.auth.users[who] = hashKey(d.auth, who, val); });
    var weak = val === normKey(who) || who.toLowerCase().split(/\s+/).some(function(part){ return part.length > 2 && val === part; });
    toast(weak ? 'Set, but anyone who knows ' + who + '\'s name can now sign in as them. Save changes to keep it.' : 'Password set for ' + who + '. Save changes, then send it to them.', weak ? 'err' : 'ok');
  }
  else if (act === 'pw-toggle') { pwShow = !pwShow; render(); }
  else if (act === 'pw-copy') copyText(passwordList(), 'Password list copied. Keep it somewhere private.');
  else if (act === 'pw-off') edit(function(d){ delete d.auth; });
  else if (act === 'pw-restore') {
    pwRestore = ($('#pw-restore') || {}).value || '';
    var A = authOn(), k3 = loadKeys(), good = 0, bad = [];
    pwRestore.split(/\r?\n/).forEach(function(line){
      var i = line.lastIndexOf(':'); if (i < 1) return;
      var name = line.slice(0, i).trim(), key = line.slice(i + 1).trim();
      if (A.users[name] && hashKey(A, name, key) === A.users[name]) { k3[name] = normKey(key); good++; } else bad.push(name);
    });
    saveKeys(k3); pwRestore = '';
    toast('Restored ' + good + '.' + (bad.length ? ' These didn\'t match: ' + bad.join(', ') + '.' : ''), bad.length ? 'err' : 'ok');
    render();
  }
  else return false;
  return true;
}

/* ---------------- import + save ---------------- */
function buildPage(data){
  var style = $('#app-style').textContent;
  var shell = $('#shell').innerHTML;
  var app = $('#app-src').textContent;
  var json = JSON.stringify(data).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n' + HEAD((data.name || 'League') + ' record book') + '\n<style id="app-style">' + style + '<\/style>\n</head>\n<body>\n' +
    '<template id="shell">' + shell + '<\/template>\n<div id="root"></div>\n<div id="toast" class="toast" role="status" hidden></div>\n' +
    '<script id="league-data" type="application/json">' + json + '<\/script>\n' +
    '<script id="app-src">' + app + '<\/script>\n</body>\n</html>\n';
}
function parseRenames(txt){
  var map = {}, bad = [];
  String(txt || '').split(/\r?\n/).forEach(function(line, i){
    if (!line.trim()) return;
    var k = line.indexOf('=');
    var a = k > 0 ? line.slice(0, k).trim() : '', b = k > 0 ? line.slice(k + 1).trim() : '';
    if (!a || !b) bad.push(i + 1); else map[a] = b;
  });
  return { map:map, bad:bad };
}
function formatRenames(map){ return Object.keys(map || {}).map(function(k){ return k + ' = ' + map[k]; }).join('\n'); }
function status(msg, kind){ var el = $('#import-status'); el.textContent = msg; el.className = kind || ''; }
function readInput(cb){
  var file = $('#in-file').files[0];
  if (file) { var fr = new FileReader(); fr.onload = function(){ cb(String(fr.result)); }; fr.onerror = function(){ status('Couldn\'t read that file. Try pasting the CSV instead.', 'err'); }; fr.readAsText(file); }
  else cb($('#in-text').value);
}
function preview(){
  readInput(function(text){
    var ren = parseRenames($('#in-renames').value);
    if (ren.bad.length) { status('Name changes line ' + ren.bad.join(', ') + ' needs the form: name in the file = name to show.', 'err'); pending = null; $('#btn-save').disabled = true; return; }
    var res;
    if (text.trim()) res = csvToRows(text);
    else if (!SAMPLE) res = { rows:DATA.games, warning:'' };
    else { status('Choose a CSV file or paste CSV text first.', 'err'); return; }
    if (res.error) { status(res.error, 'err'); pending = null; $('#btn-save').disabled = true; return; }
    pending = Object.assign(clone(DATA), { name:$('#in-name').value.trim() || DATA.name || 'Our league', games:res.rows, renames:ren.map });
    var keep = DATA; load(pending); DATA = keep;
    var nUp = res.rows.filter(function(r){ return r[6] === 'scheduled'; }).length, nSt = res.rows.filter(function(r){ return r[6] === 'strength'; }).length, nPl = res.rows.length - nUp - nSt;
    status((text.trim() ? '' : 'No new file, so using the current games. ') + (Object.keys(ren.map).length ? Object.keys(ren.map).length + ' name change' + (Object.keys(ren.map).length > 1 ? 's' : '') + ' applied. ' : '') + 'Previewing ' + nPl + ' game' + (nPl === 1 ? '' : 's') + (nUp ? ' plus ' + nUp + ' upcoming matchup' + (nUp === 1 ? '' : 's') : '') + (nSt ? ' and roster projections for ' + nSt + ' teams' : '') + ' across ' + L.seasons.length + ' season' + (L.seasons.length === 1 ? '' : 's') + '. ' + (res.warning ? res.warning + ' ' : '') + (canSave ? 'Save to show it to the whole league.' : 'This view is read-only, so the preview stays on your screen.'), res.warning ? 'err' : 'ok');
    $('#btn-save').disabled = !(canSave || (SERVER && SERVER.admin));
  });
}
function save(){
  if (pending && SERVER && SERVER.admin) {
    sendAction({ type:'import', name:pending.name, rows:pending.games, renames:pending.renames || {} });
    var dl = $('#import'); if (dl.close) dl.close(); else dl.removeAttribute('open');
    return;
  }
  if (!pending || !artifactApi) return;
  $('#btn-save').disabled = true;
  status('Saving…');
  artifactApi.publish(buildPage(pending)).then(function(){ status('Saved. Reloading with your league\'s data…', 'ok'); })
    .catch(function(e){
      var code = e && e.code;
      if (code === 'conflict') status('Someone saved a newer version first. The page is reloading to it; preview again after it loads.', 'err');
      else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled' || code === 'capability_removed' || code === 'not_declared') { canSave = false; $('#btn-save').hidden = true; status('This view is read-only. Ask the league\'s commissioner to import the data.', 'err'); }
      else if (code === 'rate_limited') { status('Saved too recently. Wait a minute and try again.', 'err'); $('#btn-save').disabled = false; }
      else if (code === 'too_large') status('That data is too big to save. Remove seasons or check for duplicate rows.', 'err');
      else { status('Saving didn\'t go through (' + (code || 'unknown error') + '). Try again in a moment.', 'err'); $('#btn-save').disabled = false; }
    });
}

function wire(){
  $('#tabs').addEventListener('click', function(e){ var b = e.target.closest('button[data-tab]'); if (b) { state.tab = b.dataset.tab; render(); } });
  $('.scope').addEventListener('click', function(e){ var b = e.target.closest('button[data-scope]'); if (b) { state.scope = b.dataset.scope; render(); } });
  $('#view').addEventListener('click', function(e){
    if (bookClick(e)) return;
    var s = e.target.closest('button[data-sort]');
    if (s) { var k = s.dataset.sort; state.sort = { key:k, dir:state.sort.key === k ? -state.sort.dir : (k === 'm' || k === 'papg' || k === 'lo' ? 1 : -1) }; render(); return; }
    var p = e.target.closest('button[data-a]');
    if (p) { var pr = [p.dataset.a, p.dataset.b]; var same = state.pair && state.pair[0] === pr[0] && state.pair[1] === pr[1]; state.pair = same ? null : pr; render(); return; }
    if (e.target.closest('#btn-column')) { writeColumn(); return; }
    if (e.target.closest('#btn-column-stop')) { if (column.ctl) column.ctl.abort(); return; }
    if (e.target.closest('#btn-column-copy')) { copyColumn(); return; }
    var c = e.target.closest('button[data-pick]');
    if (c) { var m = c.dataset.pick, i = state.picks.indexOf(m); if (i >= 0) state.picks.splice(i, 1); else if (state.picks.length < 6) state.picks.push(m); render(); }
  });
  $('#view').addEventListener('input', function(e){ bookInput(e); });
  $('#view').addEventListener('keydown', function(e){ bookKey(e); });
  $('#view').addEventListener('focusin', function(e){ if (e.target.matches && e.target.matches('[data-selectall]')) e.target.select(); });
  $('#view').addEventListener('change', function(e){
    if (bookChange(e)) return;
    if (e.target.id === 'pick-manager') { state.manager = e.target.value; render(); }
    if (e.target.id === 'pick-season') { state.season = +e.target.value; render(); }
  });
  var dlg = $('#import');
  $('#open-import').addEventListener('click', function(){ $('#in-name').value = SAMPLE ? '' : (DATA.name || ''); $('#in-renames').value = SAMPLE ? '' : formatRenames(DATA.renames); status(''); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); });
  $('#btn-close').addEventListener('click', function(){ if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); });
  $('#btn-preview').addEventListener('click', preview);
  $('#btn-save').addEventListener('click', save);
  $('#btn-save').disabled = true;
  var wasNarrow = window.innerWidth < 640, rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ var n = window.innerWidth < 640; if (n !== wasNarrow) { wasNarrow = n; render(); } }, 150); });
}

function start(){
  $('#root').innerHTML = $('#shell').innerHTML;
  wire();
  if (IN_STREAMLIT) {
    document.documentElement.classList.add('in-app');
    $('#open-import').hidden = true;
    $('#view').innerHTML = '<p class="muted">Loading the league…</p>';
    window.addEventListener('message', function(ev){
      var m = ev.data;
      if (!m || m.type !== 'streamlit:render') return;
      var a = m.args || {};
      var changed = !SERVER || SERVER.version !== a.version;
      SERVER = a;
      canSave = !!a.admin;
      $('#open-import').hidden = !a.admin;
      $('#btn-save').hidden = !a.admin;
      if (changed) { draft = null; lineEdit = null; load(a.data || { name:'', games:[] }); } else render();
      if (a.notice && a.notice_id !== lastNotice) { lastNotice = a.notice_id; toast(a.notice, a.notice_kind || 'ok'); }
      else if (!a.notice) { var tt = $('#toast'); if (tt && tt.textContent === 'Working…') tt.hidden = true; }
    });
    stPost('streamlit:componentReady', { apiVersion:1 });
    stPost('streamlit:setFrameHeight', { height:900 });
    return;
  }
  load(readEmbedded());
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function(api){
      if (!api) return;
      artifactApi = api; canSave = true;
      $('#btn-save').hidden = false;
    }).catch(function(){});
    window.claude.use('sample').then(function(api){ if (api) { sampleApi = api; if (state.tab === 'week') render(); } }).catch(function(){});
  }
}
if (typeof module !== 'undefined' && module.exports) module.exports = { compute:compute, managerStats:managerStats, streaks:streaks, h2h:h2h, csvToRows:csvToRows, sampleLeague:sampleLeague, rowsToGames:rowsToGames };
else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
