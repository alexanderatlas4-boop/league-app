name: Weekly ESPN refresh

on:
  schedule:
    - cron: "0 12 * * 2"     # Tuesdays 12:00 UTC (8 AM ET), after Monday night's games
    # - cron: "0 18 * * 4"   # Optional: Thursdays 2 PM ET, to pick up lineup and injury news
  workflow_dispatch:
    inputs:
      start:
        description: "First season to load (blank = just this season)"
        required: false
        default: ""
      rename_from:
        description: "Optional name change: the name as ESPN has it"
        required: false
        default: ""
      rename_to:
        description: "Optional name change: the name to show (blank removes the change)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/refresh.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          START: ${{ github.event.inputs.start }}
          RENAME_FROM: ${{ github.event.inputs.rename_from }}
          RENAME_TO: ${{ github.event.inputs.rename_to }}
      # GitHub pauses scheduled jobs in public repos after 60 days without activity.
      # Recording each run keeps the weekly schedule alive all season.
      - name: Keep the schedule alive
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_refresh
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add .last_refresh
          git commit -m "Weekly refresh" || exit 0
          git push
